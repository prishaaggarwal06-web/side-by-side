<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Privacy: this policy blocks every network request from scripts (connect-src 'none'),
     and only allows images/video from the device itself (blob:, data:, mediastream:). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob: mediastream:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Side by Side">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#22598F">
<title>Side by Side – a private photo journal for Be Bodywise underarm care</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --paper:#F4F8FC; --surface:#FFFFFF; --ink:#0F1E33; --ink-soft:#4E5D72;
  --plum:#22598F; --plum-ink:#FFFFFF; --line:#D6E2EF; --sage:#3F6E57; --amber:#94591A;
  --amber-bg:#FBF1E4; --sage-bg:#E9F2ED; --plum-bg:#E4EFFA; --blush:#E3EEF9; --glow:rgba(34,89,143,.12);
  --radius-lg:22px; --radius-sm:10px;
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0C1522; --surface:#132033; --ink:#E8F0F9; --ink-soft:#A7B6C9;
    --plum:#8DBBEA; --plum-ink:#0C1F36; --line:#24354D; --sage:#8CC5A8; --amber:#E7B47A;
    --amber-bg:#3A2C1C; --sage-bg:#1E3329; --plum-bg:#18304D; --blush:#14263D; --glow:rgba(141,187,234,.12);
  }
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% -10%, var(--blush) 0%, var(--paper) 60%) no-repeat, var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:20px 20px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(2rem,8vw,2.75rem);line-height:1.08;letter-spacing:-0.02em;font-weight:700;margin:8px 0 14px}
h2{font-size:1.5rem;line-height:1.2;letter-spacing:-0.01em;margin:4px 0 10px}
h3{font-size:1.05rem;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--ink-soft)}
.small{font-size:.88rem}
a{color:var(--plum)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.brand{font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:50%;background:linear-gradient(90deg,var(--plum) 50%,var(--line) 50%)}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 20px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
.btn-primary{background:var(--plum);color:var(--plum-ink)}
.btn-quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-link{background:none;color:var(--plum);padding:8px 4px;min-height:auto;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:transparent;color:var(--amber);border:1.5px solid currentColor}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:0 10px 30px -24px var(--glow)}
.note{border-radius:var(--radius-sm);padding:12px 14px;font-size:.93rem}
.note-amber{background:var(--amber-bg);color:var(--ink)}
.note-sage{background:var(--sage-bg);color:var(--ink)}
.note-plum{background:var(--plum-bg);color:var(--ink)}
.sample-banner{position:sticky;top:0;z-index:5;background:var(--plum);color:var(--plum-ink);padding:10px 16px;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sample-banner button{background:var(--plum-ink);color:var(--plum);min-height:36px;padding:6px 14px;font-size:.88rem}

/* Hero: a live demo of the compare slider is the one memorable element */
.for-brand{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:.86rem;font-weight:600;color:var(--ink-soft);margin:4px 0 14px}
.for-brand i{width:20px;height:20px;border-radius:50%;background:var(--plum);display:inline-block}
.hero-demo{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;margin:4px 0 22px;--pos:50%;
  box-shadow:0 18px 40px -22px rgba(15,40,75,.45)}
.hero-demo .pane{position:absolute;inset:0}
.hero-demo .before{background:radial-gradient(42% 46% at 52% 52%, #8E5F52 0%, rgba(142,95,82,.65) 40%, rgba(142,95,82,0) 75%), linear-gradient(160deg,#D9B3A0,#C69A86)}
.hero-demo .after{background:radial-gradient(42% 46% at 52% 52%, #B07D6C 0%, rgba(176,125,108,.55) 40%, rgba(176,125,108,0) 75%), linear-gradient(160deg,#DDBBA9,#CBA28F);
  clip-path:inset(0 0 0 var(--pos))}
.hero-demo .bar{position:absolute;top:0;bottom:0;left:var(--pos);width:3px;background:#fff;transform:translateX(-50%)}
.hero-demo .bar::after{content:"";position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);
  box-shadow:0 2px 8px rgba(0,0,0,.25);background-image:linear-gradient(90deg,transparent 44%,#22598F 44% 48%,transparent 48% 52%,#22598F 52% 56%,transparent 56%)}
.hero-demo .lbl{position:absolute;top:14px;background:rgba(255,255,255,.9);color:#0F1E33;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:650}
.hero-demo .lbl.l{left:14px}.hero-demo .lbl.r{right:14px}
.hero-demo .cap{position:absolute;left:14px;bottom:12px;color:rgba(255,255,255,.92);font-size:.76rem;font-weight:600}
@media (prefers-reduced-motion: no-preference){
  @property --pos{syntax:'<percentage>';inherits:true;initial-value:50%}
  .hero-demo{animation:sweep 3.2s ease-in-out .4s 1 both}
  @keyframes sweep{0%{--pos:50%}30%{--pos:22%}70%{--pos:78%}100%{--pos:50%}}
}
.steps{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.steps b.n{width:36px;height:36px;border-radius:50%;background:var(--plum-bg);color:var(--plum);display:grid;place-items:center;font-size:.95rem}
.steps h3{margin:2px 0 2px;font-size:1rem}
.steps p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.lock-note{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.lock-note svg{width:22px;height:22px;margin-top:1px;color:var(--plum)}
.week{font-size:.85rem;font-weight:650;color:var(--plum);margin:0 0 6px}
.empty-art{width:56px;height:56px;border-radius:16px;background:var(--plum-bg);color:var(--plum);display:grid;place-items:center;margin-bottom:10px}
.empty-art svg{width:28px;height:28px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:38px;padding:6px 14px;white-space:nowrap;background:transparent;color:var(--ink-soft);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.tips{padding-left:20px;margin:6px 0 0}
.tips li{margin-bottom:8px}

/* Capture */
.stage{position:relative;aspect-ratio:3/4;background:#000;border-radius:var(--radius-lg);overflow:hidden}
.stage video,.stage .ghost,.stage .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .mirror{transform:scaleX(-1)}
.stage .ghost{pointer-events:none}
.stage .guide{position:absolute;inset:14% 18%;border:2px dashed rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
.stage .stage-msg{position:absolute;left:12px;right:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:8px 12px;font-size:.85rem}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--plum)}
.fallback{border:1.5px dashed var(--line);border-radius:var(--radius-lg);padding:22px;text-align:left;background:var(--surface)}
label.field{display:block;font-weight:600;margin-bottom:6px}
input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;margin-bottom:6px;padding:0}
.choice{display:inline-flex;align-items:center;gap:8px;margin-right:18px;min-height:40px}
.choice input{accent-color:var(--plum);width:20px;height:20px}

/* Journal */
.entry{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry img{width:96px;height:128px;box-shadow:0 6px 16px -10px rgba(0,0,0,.4);object-fit:cover;border-radius:12px;background:var(--line)}
.tag{display:inline-block;font-size:.78rem;font-weight:650;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-plum{background:var(--plum-bg);color:var(--plum)}
.entry .actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.entry .actions .btn-link{font-size:.9rem}

/* Compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0}
.pair img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;background:var(--line)}
figcaption{font-size:.85rem;margin-top:6px}
.slider{position:relative;aspect-ratio:3/4;border-radius:var(--radius-lg);overflow:hidden;background:var(--line);touch-action:none;user-select:none}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.slider .top{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
.slider .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.slider .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.slider .chip{position:absolute;top:10px;background:rgba(255,255,255,.9);color:#0F1E33;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:650}
.slider .chip.a{left:10px}.slider .chip.b{right:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-soft);font-size:.78rem;font-weight:600;padding:6px 0;border-radius:12px}
nav.tabs a[aria-current="page"]{color:var(--plum);background:var(--plum-bg)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
footer.disclaimer{margin-top:28px;font-size:.84rem;color:var(--ink-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.brand small{display:block;font-size:.74rem;font-weight:600;color:var(--ink-soft);margin-top:-2px}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq:last-child{border-bottom:0}
details.faq summary{cursor:pointer;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--plum);font-weight:700}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:8px 0 0;color:var(--ink-soft);font-size:.94rem}
.choice-card{border-left:4px solid var(--plum)}
.section-title{font-size:1.15rem;margin:26px 0 10px}
.doc-list{padding-left:20px;margin:8px 0 0}
.doc-list li{margin-bottom:6px}
.homescreen{border:1.5px solid var(--plum);background:var(--plum-bg);border-radius:20px;padding:16px;margin-bottom:16px}
.homescreen h3{margin-bottom:4px}
.homescreen ol{padding-left:20px;margin:8px 0}
.using{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:650;margin-top:10px}
/* Camera-app style capture */
.cam{position:relative;width:100%;height:clamp(300px, calc(100svh - 300px), 640px);background:#0E0B12;border-radius:26px;overflow:hidden}
.cam video,.cam .ghost,.cam .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .shot{object-fit:contain}
.cam .mirror{transform:scaleX(-1)}
.cam .ghost{pointer-events:none}
.cam .guide{position:absolute;inset:16% 20% 26%;border:2px dashed rgba(255,255,255,.65);border-radius:50%;pointer-events:none}
.cam .stage-msg{position:absolute;left:12px;right:12px;top:12px;background:rgba(14,11,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:14px;padding:8px 12px;font-size:.84rem}
.cam-controls{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;
  background:linear-gradient(to top, rgba(14,11,18,.75), rgba(14,11,18,0))}
.cam-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:.74rem;font-weight:650;background:none;border:0;padding:0;min-height:auto;cursor:pointer}
.cam-btn .ic{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center}
.cam-btn svg{width:24px;height:24px}
.cam-controls .left{justify-self:start}.cam-controls .right{justify-self:end}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);background-clip:padding-box;box-shadow:0 0 0 3px #fff inset;padding:0;min-height:auto}
.shutter:active{transform:scale(.94)}
.review-bar{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px}
.cam-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
.cam-empty p{color:rgba(255,255,255,.75);font-size:.9rem}

/* Summary cards: one bold colour block per page */
.summary{background:linear-gradient(135deg,var(--plum),#143A63);color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:16px;position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.summary .big{font-size:2rem;font-weight:750;letter-spacing:-0.02em;line-height:1.1}
.summary .sub{opacity:.85;font-size:.92rem;margin-top:2px}
.summary .stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.summary .stats div{font-size:.8rem;opacity:.85}
.summary .stats b{display:block;font-size:1.1rem;opacity:1}
.summary .cta{margin-top:14px;background:#fff;color:#143A63;min-height:42px;padding:8px 16px;font-size:.95rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .summary{background:linear-gradient(135deg,#1E4E80,#0F2A4A)}}
.vs{display:flex;align-items:baseline;gap:10px}
.vs .arrow{opacity:.7;font-size:1.4rem}

/* Wide screens: frame the app so it doesn't float in empty space */
@media (min-width: 960px){
  main.home{max-width:1060px;padding:40px 48px 44px}
  .home-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
  .home-grid .hero-demo{margin:0}
  .home-copy h1{font-size:3rem}
  .home-copy .stack{display:flex;gap:12px}.home-copy .stack>*+*{margin-top:0}
  .home-copy .btn-block{width:auto;flex:1}
  main.home .steps{grid-template-columns:repeat(3,1fr);margin-top:36px}
}
@media (min-width: 760px){
  body{padding-bottom:140px}
  body{background:
    radial-gradient(40vw 40vw at 8% 18%, var(--glow), transparent 70%),
    radial-gradient(45vw 45vw at 95% 85%, var(--glow), transparent 70%),
    radial-gradient(120% 70% at 50% -10%, var(--blush) 0%, var(--paper) 60%) fixed, var(--paper)}
  main{background:color-mix(in srgb, var(--surface) 82%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:34px;margin:32px auto 0;padding:28px 32px 36px;box-shadow:0 30px 80px -50px rgba(15,40,75,.5)}
  nav.tabs{left:50%;right:auto;bottom:18px;transform:translateX(-50%);width:min(560px, calc(100% - 32px));border:1px solid var(--line);border-radius:24px;
    box-shadow:0 20px 50px -30px rgba(15,40,75,.55);padding:8px}
  .cam{height:clamp(320px, calc(100vh - 360px), 600px)}
}
</style>
</head>
<body>
<div id="banner"></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Main">
  <div class="inner">
    <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Journal</a>
    <a href="#/capture" data-tab="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take photo</a>
    <a href="#/compare" data-tab="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 3v18"/></svg>Compare</a>
    <a href="#/privacy" data-tab="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>Help</a>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ State ============ */
const state = {
  sample:false, side:"left", entries:[], urlCache:new Map(),
  stream:null, facing:"user", pending:null, cameraOk:null,
  compareA:null, compareB:null, compareMode:"side", ghostOpacity:0.35,
  dbError:null
};
const SIDES = {left:"Left underarm", right:"Right underarm"};
const ICON = {
  gallery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  flip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9.5V11h-1.5M10 16.5V15h1.5"/></svg>'
};

/* ============ Storage (IndexedDB, on this device only) ============ */
const DB_NAME = "side-by-side-journal", STORE = "entries";
let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    if (!("indexedDB" in window)) return reject(new Error("no-indexeddb"));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:"id"});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbTx(mode, fn){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, mode);
    const store = tx.objectStore(STORE);
    const out = fn(store);
    tx.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
const dbAll = () => dbTx("readonly", s => s.getAll());
const dbPut = (e) => dbTx("readwrite", s => s.put(e));
const dbDel = (id) => dbTx("readwrite", s => s.delete(id));

/* ============ Sample mode (illustrative images, never saved) ============ */
function makeSampleImage(week, darkness){
  const c=document.createElement("canvas"); c.width=480; c.height=640;
  const g=c.getContext("2d");
  const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const base=[214,176,158], deep=[140,98,84];
  const bg=g.createLinearGradient(0,0,0,640); bg.addColorStop(0,"rgb(222,188,170)"); bg.addColorStop(1,"rgb(205,166,148)");
  g.fillStyle=bg; g.fillRect(0,0,480,640);
  const col=mix(base,deep,darkness);
  const rg=g.createRadialGradient(240,300,20,240,300,190);
  rg.addColorStop(0,`rgba(${col.join(",")},1)`); rg.addColorStop(1,`rgba(${col.join(",")},0)`);
  g.fillStyle=rg; g.beginPath(); g.ellipse(240,300,190,150,0,0,Math.PI*2); g.fill();
  g.fillStyle="rgba(15,30,51,.78)"; g.fillRect(0,560,480,80);
  g.fillStyle="#fff"; g.font="600 22px system-ui, sans-serif";
  g.fillText("Illustrative sample – not a real photo",20,594);
  g.font="500 18px system-ui, sans-serif"; g.fillText("Week "+week,20,622);
  return c.toDataURL("image/jpeg",0.85);
}
function buildSamples(){
  const out=[]; const start=new Date(); start.setDate(start.getDate()-42);
  const plan=[[0,0.85,false,false,"Started using the roll-on."],[2,0.8,true,false,"Slight itching after applying."],[4,0.68,false,false,""],[6,0.6,false,true,"Skipped a few days while travelling."]];
  for (const side of ["left","right"]){
    plan.forEach(([w,d,itch,paused,note],i)=>{
      const dt=new Date(start); dt.setDate(dt.getDate()+w*7);
      out.push({id:`sample-${side}-${i}`, side, date:dt.toISOString().slice(0,10), createdAt:i, src:makeSampleImage(w, side==="left"?d:d-0.05), itch, paused, note, sample:true});
    });
  }
  return out;
}

/* ============ Photo quality tips (guidance only) ============ */
function photoTips(canvas){
  const w=160, h=Math.round(canvas.height*160/canvas.width);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(canvas,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data; const L=new Float32Array(w*h);
  let sum=0, hi=0, lo=0, skin=0, paper=0;
  for (let i=0,p=0;i<d.length;i+=4,p++){
    const r=d[i], gg=d[i+1], b=d[i+2];
    const l=0.2126*r+0.7152*gg+0.0722*b; L[p]=l; sum+=l; if(l>248)hi++; if(l<12)lo++;
    // Rough skin-colour check in YCbCr space (broad range, meant to cover light to deep skin tones)
    const y=0.299*r+0.587*gg+0.114*b, cb=128-0.168736*r-0.331264*gg+0.5*b, cr=128+0.5*r-0.418688*gg-0.081312*b;
    if (y>30 && cr>=133 && cr<=180 && cb>=77 && cb<=135) skin++;
    // Flat white or near-white areas typical of screenshots and documents
    if (r>230 && gg>230 && b>230 && Math.max(r,gg,b)-Math.min(r,gg,b)<15) paper++;
  }
  const n=w*h, mean=sum/n;
  let lsum=0, lsq=0, cnt=0;
  for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){ const p=y*w+x; const v=4*L[p]-L[p-1]-L[p+1]-L[p-w]-L[p+w]; lsum+=v; lsq+=v*v; cnt++; }
  const lvar=lsq/cnt-(lsum/cnt)**2;
  const tips=[];
  if (paper/n>0.45) tips.push("This looks like a screenshot or document, not a photo of skin. Journal photos work best as close-ups of your underarm.");
  else if (skin/n<0.12) tips.push("We couldn't find much skin in this photo. Check it shows your underarm before saving.");
  if (mean<60 || lo/n>0.25) tips.push("This photo looks dark. Face your usual window or turn on the same room light, and avoid flash.");
  if (mean>215 || hi/n>0.12) tips.push("Parts of this photo look washed out. Move out of direct sunlight or away from a bright lamp.");
  if (lvar<25) tips.push("This photo may be blurry. Hold still or rest your phone against something, then retake.");
  return tips;
}

/* ============ Camera ============ */
function stopCamera(){ if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; } }
async function startCamera(){
  const video=$("#cam"); if(!video) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext){ state.cameraOk=false; renderCaptureBody(); return; }
  try{
    stopCamera();
    state.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing,width:{ideal:1280},height:{ideal:1280}},audio:false});
    video.srcObject=state.stream; await video.play().catch(()=>{});
    state.cameraOk=true;
    video.classList.toggle("mirror", state.facing==="user");
  }catch(err){ state.cameraOk=false; renderCaptureBody(); }
}
function canvasFromSource(src, w, h, flip){
  const max=1280, scale=Math.min(1, max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  const g=c.getContext("2d");
  if (flip){ g.translate(c.width,0); g.scale(-1,1); }
  g.drawImage(src,0,0,c.width,c.height);
  return c;
}
function toBlob(canvas){ return new Promise(res=>canvas.toBlob(res,"image/jpeg",0.85)); }
async function takePhoto(){
  const v=$("#cam"); if(!v || !v.videoWidth) return;
  const c=canvasFromSource(v, v.videoWidth, v.videoHeight, state.facing==="user");
  stopCamera();
  await setPending(c, todayISO());
}
async function fromFile(file){
  if(!file) return;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=async ()=>{
    const c=canvasFromSource(img, img.naturalWidth, img.naturalHeight, false);
    URL.revokeObjectURL(url); stopCamera();
    await setPending(c, todayISO());
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast("That file couldn't be opened as a photo."); };
  img.src=url;
}
async function setPending(canvas, date){
  const blob=await toBlob(canvas);
  if (state.pending) URL.revokeObjectURL(state.pending.url);
  state.pending={blob, url:URL.createObjectURL(blob), tips:photoTips(canvas), date};
  renderCaptureBody();
}

  if (list.length<2) return `${header()}<h2>Compare</h2>${tabs}
    <div class="fallback"><div class="empty-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 3v18"/></svg></div><h3>You need two photos of this side to compare</h3><p class="muted small">You have ${list.length}. Come back after your next photo, ideally a week or more later.</p>
    ${state.sample?"":`<a class="btn btn-primary" href="#/capture">Take a photo</a>`}
    ${state.sample?"":`<p style="margin-top:10px"><button class="btn-link" data-action="start-sample">Or try with sample photos</button></p>`}</div>`;
  const ids=list.map(e=>e.id);
  if (!ids.includes(state.compareA)) state.compareA=list[0].id;
  if (!ids.includes(state.compareB) || state.compareB===state.compareA) state.compareB=list[list.length-1].id===state.compareA?list[0].id:list[list.length-1].id;
  let A=list.find(e=>e.id===state.compareA), B=list.find(e=>e.id===state.compareB);
  if (A.date>B.date) [A,B]=[B,A];
  const opts=(sel)=>list.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${fmtDate(e.date)}</option>`).join("");
  const cap=(e)=>`Week ${weekOf(e)} · ${fmtDate(e.date)}${e.itch?" · itching noted":""}${e.paused?" · paused use":""}`;
  const body = state.compareMode==="side"
    ? `<div class="pair">
        <figure><img src="${srcFor(A)}" alt="Earlier photo, ${fmtDate(A.date)}"><figcaption>${esc(cap(A))}${A.note?`<br><span class="muted">${esc(A.note)}</span>`:""}</figcaption></figure>
        <figure><img src="${srcFor(B)}" alt="Later photo, ${fmtDate(B.date)}"><figcaption>${esc(cap(B))}${B.note?`<br><span class="muted">${esc(B.note)}</span>`:""}</figcaption></figure>
      </div>`
    : `<div class="slider" id="slider" style="--pos:50%">
        <img src="${srcFor(B)}" alt="Later photo, ${fmtDate(B.date)}">
        <img class="top" src="${srcFor(A)}" alt="Earlier photo, ${fmtDate(A.date)}">
        <div class="handle" aria-hidden="true"></div>
        <span class="chip a">Week ${weekOf(A)}</span><span class="chip b">Week ${weekOf(B)}</span>
      </div>
      <div class="range-row" style="margin-top:10px"><input id="slide" type="range" min="0" max="100" value="50" aria-label="Move the divider between the earlier and later photo"></div>`;
  const head = `<div class="summary"><div class="vs"><span class="big">Week ${weekOf(A)}</span><span class="arrow">→</span><span class="big">Week ${weekOf(B)}</span></div>
      <div class="sub">${daysBetween(A.date,B.date)} days apart. Look closely at tone and texture, and remember light and angle can differ.</div></div>`;
  return `${header()}<h2>Compare</h2>${tabs}${head}
  <div class="grid2" style="margin-bottom:12px">
    <div><label class="field small" for="pickA">Earlier</label><select id="pickA">${opts(A.id)}</select></div>
    <div><label class="field small" for="pickB">Later</label><select id="pickB">${opts(B.id)}</select></div>
  </div>
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="seg" role="group" aria-label="View">
      <button data-action="mode" data-mode="side" aria-pressed="${state.compareMode==="side"}">Side by side</button>
      <button data-action="mode" data-mode="slider" aria-pressed="${state.compareMode==="slider"}">Slider</button>
    </div>
  </div>
  ${body}
  <p class="small muted" style="margin-top:14px">You're the judge here. Differences can come from light, angle or camera as well as skin, so look at a few pairs before drawing conclusions.</p>
  ${itchNotice(list)}`;
}

async function viewPrivacy(){
  let persisted=null; try{ persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; }catch{}
  const count = state.sample ? 0 : state.entries.length;
  return `${header()}<h2>Help and privacy</h2>
  ${homeScreenCard()}

  <h3 class="section-title">When to see a doctor</h3>
  <div class="panel">
    <p style="margin:0">This app can't tell you why your skin looks or feels the way it does. Stop using the product and see a dermatologist or doctor if you notice:</p>
    <ul class="doc-list">
      <li>Itching, burning, redness or a rash that doesn't settle after you stop the product.</li>
      <li>Broken, cracked, oozing or painful skin.</li>
      <li>Darkening that appears suddenly, spreads quickly, or feels thick or velvety.</li>
      <li>Similar darkening in other skin folds, such as the neck, or alongside other health changes. This can sometimes be linked to an underlying condition worth checking.</li>
      <li>A lump or swelling in your underarm. Get this checked promptly.</li>
    </ul>
  </div>

  <h3 class="section-title">Using your roll-on</h3>
  <div class="panel">
    <p style="margin:0">Always follow the directions on your own pack. Be Bodywise roll-on listings advise:</p>
    <ul class="doc-list">
      <li>Doing a patch test before first use.</li>
      <li>Applying to clean, dry underarm skin and letting it dry fully.</li>
      <li>Avoiding broken or freshly shaved skin.</li>
    </ul>
    <p class="small muted" style="margin:8px 0 0">If you get itching, the journal's "itching" note lets you look back at when it happened.</p>
  </div>

  <h3 class="section-title">Questions</h3>
  <div class="panel" style="padding:4px 18px">
    <details class="faq"><summary>Can the app tell me if my pigmentation is improving?</summary><p>No. Photos are affected by light, angle and camera, so the app doesn't score your skin. It helps you take consistent photos and compare them yourself, instead of relying on memory.</p></details>
    <details class="faq"><summary>How often should I take a photo?</summary><p>About once a week, at the same time of day and in the same spot. Daily photos change too little to compare.</p></details>
    <details class="faq"><summary>Why compare left and right separately?</summary><p>Each side can look different and respond differently, so like-for-like comparisons are fairer.</p></details>
    <details class="faq"><summary>What if I stop using the product?</summary><p>Keep taking weekly photos and tick "paused use". You'll be able to see for yourself what changes when you stop and restart.</p></details>
    <details class="faq"><summary>Is this an official Be Bodywise app?</summary><p>No. It's an independent concept built for the Mosaic Fellowship Builder Round, based on conversations with Be Bodywise customers.</p></details>
  </div>

  <h3 class="section-title">Your photos</h3>
  <div class="panel stack">
    <p><strong>Your photos stay on this device.</strong> They're saved in this browser's own storage. There's no account and no server, and nothing is uploaded.</p>
    <p class="small muted">This page's security policy blocks scripts from making network requests, so photos can't be sent anywhere. That covers camera photos, gallery uploads and comparisons.</p>
    <p><strong>Photos saved:</strong> ${count}</p>
  </div>
  <div class="note note-amber" style="margin-top:14px"><strong>Your photos can be lost.</strong> Clearing your browser data, using private or incognito browsing, or switching browser or phone will remove them. Use Download in the journal to keep copies.${persisted===true?" Your browser has agreed to keep this storage unless you clear site data.":""}</div>
  ${count?`<button class="btn-danger btn-block" style="margin-top:16px" data-action="delete-all">Delete all my photos</button>`:""}
  ${DISCLAIMER}`;
}

/* ============ Router ============ */
const routes = {"":viewHome, home:viewHome, setup:viewSetup, capture:viewCapture, journal:viewJournal, compare:viewCompare, privacy:viewPrivacy};
async function render(){
  const route=(location.hash.replace(/^#\/?/,"")||"home").split("?")[0];
  if (route!=="capture"){ stopCamera(); }
  setBanner();
  const view=routes[route]||viewHome;
  $("#view").classList.toggle("home", view===viewHome);
  $("#view").innerHTML = await view();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===route?"page":"false"));
  if (route==="capture" && !state.sample) renderCaptureBody();
  if (route==="compare") bindCompare();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
function go(r){ if (location.hash==="#/"+r) render(); else location.hash="#/"+r; }

/* ============ Interactions ============ */
function bindCompare(){
  const a=$("#pickA"), b=$("#pickB");
  if (a) a.onchange=()=>{ state.compareA=a.value; render(); };
  if (b) b.onchange=()=>{ state.compareB=b.value; render(); };
  const s=$("#slider"), r=$("#slide");
  if (s && r){
    const set=(v)=>{ v=Math.max(0,Math.min(100,v)); s.style.setProperty("--pos",v+"%"); r.value=v; };
    r.oninput=()=>set(+r.value);
    const fromPointer=(e)=>{ const rect=s.getBoundingClientRect(); set((e.clientX-rect.left)/rect.width*100); };
    s.onpointerdown=(e)=>{ s.setPointerCapture(e.pointerId); fromPointer(e); };
    s.onpointermove=(e)=>{ if (e.buttons) fromPointer(e); };
  }
}
document.addEventListener("input", (e)=>{
  if (e.target.id==="ghost-op"){ state.ghostOpacity=+e.target.value; const g=$("#ghost"); if(g) g.style.opacity=state.ghostOpacity; }
});
document.addEventListener("change", (e)=>{ if (e.target.id==="file-in") fromFile(e.target.files[0]); });
document.addEventListener("click", async (e)=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action;
  if (a==="start-journal"){ go(lsGet("sbs-setup-done")?"capture":"setup"); }
  else if (a==="setup-done"){ const f=$("#f-product"); if(f && f.value) lsSet("sbs-product", f.value); lsSet("sbs-setup-done","1"); go("capture"); }
  else if (a==="hs-dismiss"){ lsSet("sbs-hs-dismissed","1"); render(); }
  else if (a==="start-sample"){ state.sample=true; await loadEntries(); state.compareA=state.compareB=null; go("compare"); }
  else if (a==="exit-sample"||a==="exit-sample-capture"){ state.sample=false; await loadEntries(); state.compareA=state.compareB=null; go(a==="exit-sample-capture" ? (lsGet("sbs-setup-done")?"capture":"setup") : "home"); }
  else if (a==="side"){ state.side=el.dataset.side; state.compareA=state.compareB=null; if(state.pending){URL.revokeObjectURL(state.pending.url); state.pending=null;} render(); }
  else if (a==="shoot"){ takePhoto(); }
  else if (a==="flip"){ state.facing = state.facing==="user"?"environment":"user"; startCamera(); }
  else if (a==="retake"){ if(state.pending){URL.revokeObjectURL(state.pending.url); state.pending=null;} state.cameraOk=null; renderCaptureBody(); }
  else if (a==="save"){
    const p=state.pending; if(!p) return;
    const date=$("#f-date").value || todayISO();
    const itch=(document.querySelector('input[name="itch"]:checked')||{}).value==="yes";
    const paused=(document.querySelector('input[name="paused"]:checked')||{}).value==="yes";
    const note=$("#f-note").value.trim().slice(0,280);
    const entry={id:uid(), side:state.side, date, createdAt:Date.now(), blob:p.blob, itch, paused, note};
    try{
      await dbPut(entry);
      try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch{}
      URL.revokeObjectURL(p.url); state.pending=null;
      await loadEntries(); toast("Saved to journal"); go("journal");
    }catch(err){ toast("Couldn't save. This browser may be blocking storage."); }
  }
  else if (a==="compare-with"){ const e2=state.entries.find(x=>x.id===el.dataset.id); const list=bySide(state.side); state.compareB=e2.id; state.compareA=(list[0].id===e2.id && list[1])?list[list.length-1].id:list[0].id; go("compare"); }
  else if (a==="download"){ const x=state.entries.find(y=>y.id===el.dataset.id); if(!x) return; const link=document.createElement("a"); link.href=srcFor(x); link.download=`side-by-side-${x.side}-${x.date}.jpg`; document.body.appendChild(link); link.click(); link.remove(); }
  else if (a==="delete"){ if(!confirm("Delete this photo? This can't be undone.")) return; await dbDel(el.dataset.id); forgetUrl(el.dataset.id); await loadEntries(); toast("Photo deleted"); render(); }
  else if (a==="delete-all"){ if(!confirm("Delete all your photos and notes from this device? This can't be undone.")) return; await dbClear(); [...state.urlCache.keys()].forEach(forgetUrl); await loadEntries(); toast("All photos deleted"); render(); }
  else if (a==="mode"){ state.compareMode=el.dataset.mode; render(); }
});

/* ============ Start ============ */
(async function init(){ await loadEntries(); render(); })();
</script>
</body>
